<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pannello – Alessio Melia</title>
<style>
:root{--bg:#0d0d0e;--panel:#161617;--line:#2a2a2c;--text:#ececea;--mute:#8d8d90;--acc:#ff6a13;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:18px;margin:0}
h2{font-size:16px;margin:0 0 4px}
button,.btn{font:500 14px system-ui;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--text)}
.pri{background:var(--acc);border-color:var(--acc);color:#111}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:14px 20px 0}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
.tabs small{color:var(--mute);margin-left:4px}
.layout{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:20px}
.one{padding:20px;max-width:900px}
.list{display:flex;flex-direction:column;gap:6px}
.gh{display:flex;align-items:center;gap:8px;margin:14px 0 2px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.gh:first-child{margin-top:0}
.gh b{font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.gh span{color:var(--mute);font-size:12px;flex:1}
.gh button{padding:3px 9px;font-size:12px}
.item{padding:9px 12px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.item.on{border-color:var(--acc)}
.item small{color:var(--mute);display:block}
.pane{background:var(--panel);border:1px solid var(--line);padding:20px;display:grid;gap:14px;align-content:start}
label{display:grid;gap:4px;color:var(--mute);font-size:13px}
input,select,textarea{font:15px system-ui;background:var(--bg);color:var(--text);border:1px solid var(--line);padding:9px;width:100%}
textarea{min-height:90px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ck{display:flex;align-items:center;gap:8px;color:var(--text)}
.ck input{width:auto}
.bar{display:flex;gap:8px;flex-wrap:wrap}
details{margin-top:18px;background:var(--panel);border:1px solid var(--line);padding:10px 12px}
summary{cursor:pointer;color:var(--mute);font-size:13px}
details label{margin-top:10px}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--acc);color:#111;padding:10px 18px;display:none;max-width:90vw;z-index:20}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:22px;width:min(520px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.7)}
.note{color:var(--mute);font-size:13px;margin:0}
@media(max-width:800px){.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Pannello contenuti <span class="note" id="state"></span></h1>
  <div class="bar">
    <button id="reset">Scarta bozza</button>
    <button id="imp">Importa</button>
    <button id="dl">Scarica data.json</button>
    <button id="gh" class="pri">Pubblica su GitHub</button>
  </div>
</header>
<div class="tabs" id="tabs"></div>
<div id="root"></div>
<div id="msg"></div>
<input type="file" id="file" accept=".json" hidden>

<dialog id="dlg">
  <h3 style="margin-top:0">Pubblica su GitHub</h3>
  <p class="note">Salva data.json direttamente nel repository: il sito si aggiorna da solo dopo circa un minuto. Il token resta solo in questo browser.</p>
  <div style="display:grid;gap:12px;margin-top:14px">
    <div class="row"><label>Utente GitHub<input id="g_o"></label><label>Repository<input id="g_r"></label></div>
    <div class="row"><label>Branch<input id="g_b" value="main"></label><label>Percorso file<input id="g_p" value="data.json"></label></div>
    <label>Token (fine-grained, permesso Contents: Read and write)<input id="g_t" type="password" autocomplete="off"></label>
    <div class="bar"><button id="g_go" class="pri">Pubblica</button><button id="g_x">Chiudi</button></div>
  </div>
</dialog>

<script>
let D, sel=-1, tab="home";
const TABS=[["home","Home"],["filmmaker","Filmmaker / Camera Op."],["camera","Camera Department"],["clients","Clienti"],["contact","Contatti"]];
const AREA={filmmaker:"Filmmaker / Camera Op.",camera:"Camera Department"};
const $=s=>document.querySelector(s), root=$("#root");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=t=>{const m=$("#msg");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",3200)};
const save=()=>{localStorage.setItem("am_draft",JSON.stringify(D));$("#state").textContent="· bozza non pubblicata"};
const slug=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const newId=t=>(slug(t)||"progetto")+"-"+Math.random().toString(36).slice(2,6);
const gl=(v,l)=>v&&typeof v==="object"?(v[l]??""):(l==="it"?(v??""):"");
const sl=(o,k,l,val)=>{let v=o[k];if(!(v&&typeof v==="object"))v={it:v??"",en:""};v[l]=val;o[k]=v};
const bi=(label,attr,key,v,ta)=>["it","en"].map(l=>`<label>${label} (${l.toUpperCase()})${ta?`<textarea ${attr}="${key}" data-l="${l}">${esc(gl(v,l))}</textarea>`:`<input ${attr}="${key}" data-l="${l}" value="${esc(gl(v,l))}">`}</label>`).join("");
const list=v=>v.split(",").map(x=>x.trim()).filter(Boolean);

function normalize(d){
  d.site=d.site||{};["location","tagline","bio"].forEach(k=>{const v=d.site[k];d.site[k]=v&&typeof v==="object"?v:{it:v??"",en:""}});
  delete d.services;delete d.site.behance;
  d.categories=d.categories||{};d.categories.filmmaker=d.categories.filmmaker||[];d.categories.camera=d.categories.camera||[];
  d.clients=d.clients||[];d.works=d.works||[];
  d.works.forEach(w=>{w.id=w.id||newId(w.title);["client","prod","year","gear","thumb","preview","url"].forEach(k=>w[k]=w[k]??"");
    ["role","desc"].forEach(k=>{const v=w[k];w[k]=v&&typeof v==="object"?v:{it:v??"",en:""}})});
  return d;
}
async function init(){
  const draft=localStorage.getItem("am_draft");
  if(draft){D=normalize(JSON.parse(draft));$("#state").textContent="· bozza non pubblicata"}
  else{try{D=normalize(await (await fetch("data.json?"+Date.now())).json())}catch{D=normalize({site:{name:"",email:"",instagram:""}});toast("data.json non trovato: parti da zero o usa Importa")}}
  render();
}
function render(){
  $("#tabs").innerHTML=TABS.map(([k,n])=>`<button data-t="${k}" class="${k===tab?"on":""}">${n}${AREA[k]?`<small>${D.works.filter(w=>w.area===k).length}</small>`:""}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  ({home:renderHome,filmmaker:()=>renderArea("filmmaker"),camera:()=>renderArea("camera"),clients:renderClients,contact:renderContact})[tab]();
}

function camBox(w){const c=w.cam,cats=D.categories.camera||[];
  const d=c&&c.desc&&typeof c.desc==="object"?c.desc:{it:c&&c.desc||"",en:""};
  return `<div class="pane" style="margin:14px 0;padding:14px;border:1px dashed var(--line,#444)"><label class="ck"><input type="checkbox" data-cam="on" ${c?"checked":""}> Mostra anche nel Camera Department (copia collegata: link e miniatura restano quelli di questo lavoro)</label>
  ${c?`<div class="row"><label>Sezione camera<select data-camf="cat">${cats.map(x=>`<option ${x===c.cat?"selected":""}>${esc(x)}</option>`).join("")}</select></label>
  <label>Titolo diverso (vuoto = stesso)<input data-camf="title" value="${esc(c.title||"")}"></label></div>
  <label>Attrezzatura nella copia (vuoto = stessa)<input data-camf="gear" value="${esc(c.gear||"")}"></label>
  <div class="row"><label>Nota IT (vuoto = stessa)<input data-camd="it" value="${esc(d.it||"")}"></label><label>Nota EN<input data-camd="en" value="${esc(d.en||"")}"></label></div>`:""}</div>`}
function editorHtml(w){return `<div class="pane">
  <h2>Modifica progetto</h2>
  <label>Titolo<input data-f="title" value="${esc(w.title)}"></label>
  <div class="row">
    <label>Sezione (cambiandola il progetto si sposta)<select data-f="area"><option value="filmmaker" ${w.area==="filmmaker"?"selected":""}>Filmmaker / Camera Op.</option><option value="camera" ${w.area==="camera"?"selected":""}>Camera Department</option></select></label>
    <label>Categoria<select data-f="cat">${D.categories[w.area].map(c=>`<option ${c===w.cat?"selected":""}>${esc(c)}</option>`).join("")}</select></label></div>
  <div class="row"><label>Cliente<input data-f="client" value="${esc(w.client)}"></label><label>Produzione / agenzia<input data-f="prod" value="${esc(w.prod||"")}"></label><label>Anno<input data-f="year" value="${esc(w.year)}" placeholder="2026"></label></div>
  <div class="row">${bi("Ruolo (es. Riprese, Regia e montaggio, 1AC)","data-wl","role",w.role,false)}</div>
  <label>Link al video (Instagram, YouTube, Vimeo)<input data-f="url" value="${esc(w.url)}"></label>
  <label>Gear / attrezzatura (es. FX3 con zoom vintage, gimbal)<input data-f="gear" value="${esc(w.gear)}"></label>
  <div class="row">${bi("Backstage / descrizione (un paragrafo per riga vuota)","data-wl","desc",w.desc,true)}</div>
  <div class="row"><label>Miniatura (es. img/nome.jpg)<input data-f="thumb" value="${esc(w.thumb)}"></label>
  <label>Anteprima al passaggio del mouse (mp4 breve, opzionale)<input data-f="preview" value="${esc(w.preview)}"></label></div>
  <label>Tipo di contenuto (video: anteprima mp4 al passaggio del mouse · foto: leggero zoom)<select data-f="kind"><option value="video" ${w.kind!=="photo"?"selected":""}>Video</option><option value="photo" ${w.kind==="photo"?"selected":""}>Foto</option></select></label>
  <label>Indirizzo della scheda (non cambiarlo dopo averlo condiviso)<input data-f="id" value="${esc(w.id)}"></label>
  <p class="note">Link da condividere: .../#/work/${esc(w.id)}</p>
  <label class="ck"><input type="checkbox" data-f="best" ${w.best?"checked":""}> Mostra nella selezione della homepage</label>
  ${w.area==="filmmaker"?camBox(w):""}
  <div class="bar"><button id="up">Sposta su</button><button id="down">Sposta giù</button><button id="del">Elimina</button></div>
  <p class="note">Le immagini vanno caricate nella cartella img/ del repository. "Sposta" cambia l'ordine dentro la stessa categoria (vale per l'ordine "personalizzato" sul sito). Se lasci vuoto l'inglese, il sito mostra l'italiano.</p></div>`}

function linked(){const L=D.works.map((w,i)=>[w,i]).filter(([w])=>w.cam&&w.cam.cat);
  return `<div class="gh"><b>Collegati da Filmmaker</b><span>${L.length}</span></div><p class="note">Copie automatiche: si modificano dal lavoro originale in Filmmaker.</p>${L.map(([w,i])=>`<div class="item" data-go="${i}">${esc(w.cam.title||w.title)}<small>${esc(w.cam.cat)} · da ${esc(w.cat)}</small></div>`).join("")||'<p class="note">Nessuno.</p>'}`}
function renderArea(a){
  const cats=D.categories[a], mine=D.works.map((w,i)=>[w,i]).filter(([w])=>w.area===a);
  if(!(D.works[sel]&&D.works[sel].area===a))sel=mine.length?mine[0][1]:-1;
  const item=([w,i])=>`<div class="item ${i===sel?"on":""}" data-i="${i}">${esc(w.title||"Senza titolo")}<small>${[w.client,w.year].filter(Boolean).map(esc).join(" · ")}${w.best?" · in home":""}</small></div>`;
  const groups=cats.map(c=>{const it=mine.filter(([w])=>w.cat===c);
    return `<div class="gh"><b>${esc(c)}</b><span>${it.length} ${it.length===1?"lavoro":"lavori"}</span><button data-add="${esc(c)}">+ Nuovo</button></div>${it.map(item).join("")||'<p class="note">Nessun lavoro.</p>'}`}).join("");
  const orph=mine.filter(([w])=>!cats.includes(w.cat));
  const other=orph.length?`<div class="gh"><b>Senza categoria</b><span>${orph.length}</span></div><p class="note">Categoria rimossa o rinominata: aprili e scegline una.</p>${orph.map(item).join("")}`:"";
  const w=D.works[sel];
  root.innerHTML=`<div class="layout"><div><h2>${AREA[a]}</h2><p class="note" style="margin-bottom:12px">I lavori sono divisi per categoria, come sul sito.</p>
    <div class="list">${groups}${other}</div>
    ${a==="camera"?linked():""}
    <details><summary>Gestisci le categorie di questa sezione</summary><label>Categorie (separate da virgola)<input id="cats" value="${esc(cats.join(", "))}"></label><p class="note" style="margin-top:6px">Se rinomini una categoria, i lavori che la usavano finiscono in "Senza categoria" finché non li riassegni.</p></details></div>
    ${w?editorHtml(w):'<div class="pane"><p class="note">Nessun progetto in questa sezione. Usa "+ Nuovo" in una categoria.</p></div>'}</div>`;
  root.querySelectorAll(".item[data-i]").forEach(e=>e.onclick=()=>{sel=+e.dataset.i;render()});
  root.querySelectorAll(".item[data-go]").forEach(e=>e.onclick=()=>{sel=+e.dataset.go;tab="filmmaker";render()});
  root.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{D.works.unshift({id:newId("nuovo"),area:a,cat:b.dataset.add,title:"Nuovo progetto",client:"",prod:"",year:String(new Date().getFullYear()),role:{it:"",en:""},gear:"",desc:{it:"",en:""},url:"",thumb:"",preview:"",best:false});sel=0;save();render()});
  $("#cats").onchange=e=>{D.categories[a]=list(e.target.value);save();render()};
  if(!w)return;
  root.querySelectorAll("[data-f]").forEach(e=>e.onchange=()=>{const f=e.dataset.f;let v=e.type==="checkbox"?e.checked:e.value;
    if(f==="id")v=slug(v)||newId(w.title);
    w[f]=v;if(f==="area"){w.cat=D.categories[v][0]||"";tab=v;if(v==="camera")delete w.cam}
    save();render()});
  root.querySelectorAll("[data-wl]").forEach(e=>e.onchange=()=>{sl(w,e.dataset.wl,e.dataset.l,e.value);save()});
  root.querySelectorAll("[data-cam]").forEach(e=>e.onchange=()=>{if(e.checked)w.cam={cat:(D.categories.camera||[])[0]||"",title:"",gear:"",desc:{it:"",en:""}};else delete w.cam;save();render()});
  root.querySelectorAll("[data-camf]").forEach(e=>e.onchange=()=>{w.cam[e.dataset.camf]=e.value;save()});
  root.querySelectorAll("[data-camd]").forEach(e=>e.onchange=()=>{if(typeof w.cam.desc!=="object")w.cam.desc={it:"",en:""};w.cam.desc[e.dataset.camd]=e.value;save()});
  const mv=d=>{let j=sel+d;while(j>=0&&j<D.works.length&&!(D.works[j].area===w.area&&D.works[j].cat===w.cat))j+=d;
    if(j<0||j>=D.works.length)return;[D.works[sel],D.works[j]]=[D.works[j],D.works[sel]];sel=j;save();render()};
  $("#up").onclick=()=>mv(-1);$("#down").onclick=()=>mv(1);
  $("#del").onclick=()=>{if(confirm("Eliminare questo progetto?")){D.works.splice(sel,1);sel=-1;save();render()}};
}

function renderHome(){
  const s=D.site;
  const pick=a=>{const m=D.works.map((w,i)=>[w,i]).filter(([w])=>w.area===a);
    return `<h2 style="margin-top:12px">${AREA[a]}</h2>${m.map(([w,i])=>`<label class="ck"><input type="checkbox" data-best="${i}" ${w.best?"checked":""}> ${esc(w.title||"Senza titolo")} <span class="note">· ${esc(w.cat)}</span></label>`).join("")||'<p class="note">Nessun lavoro.</p>'}`};
  root.innerHTML=`<div class="one"><div class="pane">
    <h2>Testi della home</h2>
    <label>Nome<input data-s="name" value="${esc(s.name)}"></label>
    <div class="row">${bi("Riga sotto il nome (es. Milano · IT — Worldwide)","data-sl","location",s.location,false)}</div>
    <div class="row">${bi("Frase in homepage","data-sl","tagline",s.tagline,true)}</div>
    <div class="row">${bi("Chi sono","data-sl","bio",s.bio,true)}</div></div>
    <div class="pane" style="margin-top:20px"><h2>Selezione in homepage</h2><p class="note">Spunta i lavori che vuoi mostrare nella sezione "Selezione". Si possono anche cambiare dentro ogni progetto.</p>${pick("filmmaker")}${pick("camera")}</div></div>`;
  root.querySelectorAll("[data-s]").forEach(e=>e.onchange=()=>{D.site[e.dataset.s]=e.value;save()});
  root.querySelectorAll("[data-sl]").forEach(e=>e.onchange=()=>{sl(D.site,e.dataset.sl,e.dataset.l,e.value);save()});
  root.querySelectorAll("[data-best]").forEach(e=>e.onchange=()=>{D.works[+e.dataset.best].best=e.checked;save()});
}
function renderClients(){
  root.innerHTML=`<div class="one"><div class="pane"><h2>Clienti (la fascia che scorre in home)</h2>
    <label>Uno per riga: Nome oppure Nome | img/logo.png<textarea id="cli" style="min-height:220px">${esc(D.clients.map(c=>typeof c==="string"?c:c.name+" | "+c.logo).join("\n"))}</textarea></label>
    <p class="note">Se aggiungi il logo (caricato nella cartella img/ del repository) compare l'immagine al posto del nome.</p></div></div>`;
  $("#cli").onchange=e=>{D.clients=e.target.value.split("\n").filter(Boolean).map(l=>{const[a,b]=l.split("|").map(x=>x.trim());return b?{name:a,logo:b}:a});save()};
}
function renderContact(){
  const s=D.site;
  root.innerHTML=`<div class="one"><div class="pane"><h2>Contatti</h2>
    <label>Email<input data-s="email" value="${esc(s.email)}"></label>
    <label>Instagram (URL)<input data-s="instagram" value="${esc(s.instagram)}"></label></div></div>`;
  root.querySelectorAll("[data-s]").forEach(e=>e.onchange=()=>{D.site[e.dataset.s]=e.value;save()});
}

$("#reset").onclick=()=>{if(confirm("Scartare la bozza e ricaricare i contenuti pubblicati sul sito?")){localStorage.removeItem("am_draft");location.reload()}};
$("#dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:"application/json"}));a.download="data.json";a.click()};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{try{D=normalize(JSON.parse(await e.target.files[0].text()));sel=-1;save();render();toast("Importato")}catch{toast("File non valido")}};

const K=["o","r","b","p","t"];
$("#gh").onclick=()=>{K.forEach(k=>{const v=localStorage.getItem("am_gh_"+k);if(v)$("#g_"+k).value=v});$("#dlg").showModal()};
$("#g_x").onclick=()=>$("#dlg").close();
$("#g_go").onclick=async()=>{
  const v=k=>$("#g_"+k).value.trim();K.forEach(k=>localStorage.setItem("am_gh_"+k,v(k)));
  const url=`https://api.github.com/repos/${v("o")}/${v("r")}/contents/${v("p")}`,H={Authorization:"Bearer "+v("t"),Accept:"application/vnd.github+json"};
  try{
    let sha;const g=await fetch(url+"?ref="+v("b"),{headers:H});if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error("Lettura fallita ("+g.status+"): controlla token e repository");
    const body={message:"Aggiorna contenuti dal pannello",branch:v("b"),content:btoa(unescape(encodeURIComponent(JSON.stringify(D,null,2)))),...(sha?{sha}:{})};
    const p=await fetch(url,{method:"PUT",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!p.ok)throw new Error("Scrittura fallita ("+p.status+")");
    localStorage.removeItem("am_draft");$("#state").textContent="· pubblicato";$("#dlg").close();toast("Pubblicato. Il sito si aggiorna tra circa un minuto.");
  }catch(err){toast(err.message)}
};
init();
</script>
</body>
</html>
