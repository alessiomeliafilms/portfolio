 const ctx=cv.getContext("2d");

   let gd=ctx.createRadialGradient(lx,ly,0,lx,ly,lr);gd.addColorStop(0,"rgba(255,106,19,.16)");gd.addColorStop(.5,"rgba(255,70,0,.05)");gd.addColorStop(1,"rgba(255,70,0,0)");

   const mx=W*(.2+.3*Math.cos(t*.00017)),my=H*(.85-.2*Math.sin(t*.00025));gd=ctx.createRadialGradient(mx,my,0,mx,my,lr*.55);

(function(){

  const gc=document.getElementById("gchips");if(gc)gc.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;S.g=b.dataset.g;gc.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));fill(r)};
 }else{
  app.innerHTML=home();
  startFX();

 }
